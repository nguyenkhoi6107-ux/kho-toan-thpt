12.8.25: {ten: "Tìm tham số để hai vectơ cùng phương", trang_thai: da-duyet}
12.8.26: {ten: "Điểm trên trục tọa độ cách đều hai điểm cho trước", trang_thai: da-duyet}
12.8.27: {ten: "Tọa độ trọng tâm tam giác, tứ diện", trang_thai: da-duyet}
