11.29.1: {ten: "Xác suất của biến cố đối từ bảng phân bố xác suất (cuộc gọi đến trung tâm cứu hộ)", trang_thai: de-xuat}
12.1.16: {ten: "Khoảng đồng biến của hàm phân thức bậc nhất trên bậc nhất (chọn đáp án đúng)", trang_thai: da-duyet}
12.4.10: {ten: "Hàm bậc ba đọc từ đồ thị: giá trị cực tiểu, nghiệm phương trình lôgarit, khoảng đồng biến, tổng hệ số (Đúng/Sai)", trang_thai: da-duyet}
12.5.15: {ten: "Tối ưu lợi nhuận khi biết doanh thu và chi phí bình quân (hàm bậc ba trên một đoạn)", trang_thai: da-duyet}
12.6.6: {ten: "Khẳng định sai về tích vô hướng của các vectơ trong hình chóp đều", trang_thai: da-duyet}
12.7.4: {ten: "Thể tích tứ diện OABC khi A, B, C nằm trên ba trục tọa độ", trang_thai: da-duyet}
12.11.8: {ten: "Nguyên hàm của đa thức (bình phương nhị thức) thỏa F(0) cho trước, tính F(a)", trang_thai: da-duyet}
12.12.9: {ten: "Chất điểm trên trục số với vận tốc bậc hai: quãng đường, vị trí, tốc độ lớn nhất, hai chất điểm gặp nhau (Đúng/Sai)", trang_thai: da-duyet}
12.17.6: {ten: "Vùng phủ sóng hình cầu của trạm phát sóng: phương trình mặt cầu, vị trí điểm, khoảng cách đến mặt phẳng, đường đi (Đúng/Sai)", trang_thai: da-duyet}
12.18.5: {ten: "Xác suất một xạ thủ bắn trúng khi biết có ít nhất một viên trúng đích (hai xạ thủ độc lập)", trang_thai: da-duyet}
# --- Đề xuất từ đơn vị D14 ((NBV) Đề số 14), ngày 15/10/2026 ---
12.12.10: {ten: "Tích phân trên đoạn từ hai diện tích S1, S2 đọc từ hình vẽ (S1 - S2)", trang_thai: da-duyet}
12.6.7: {ten: "Tổng bốn vectơ từ đỉnh chóp đến các đỉnh của đáy hình bình hành (qua tâm O)", trang_thai: da-duyet}
12.15.7: {ten: "Phương trình chính tắc của đường thẳng đi qua hai điểm", trang_thai: da-duyet}
11.21.9: {ten: "Mô hình nhiệt độ đồ uống T = 22 + 50e^(-t/8): giải phương trình mũ, làm tròn thời gian", trang_thai: da-duyet}
12.19.8: {ten: "Hai phác đồ điều trị: xác suất toàn phần, Bayes, độc lập trong từng phác đồ (Đúng/Sai)", trang_thai: da-duyet}
12.4.11: {ten: "Bảng biến thiên: cực đại, giá trị nhỏ nhất hàm hợp căn thức, số nghiệm phương trình, số giá trị nguyên của tham số (Đúng/Sai)", trang_thai: da-duyet}
12.15.8: {ten: "Điểm M mà tam giác ABM có diện tích không đổi: độ dài AB, đường thẳng AB, khoảng cách từ C đến AB, MC nhỏ nhất (Đúng/Sai)", trang_thai: da-duyet}
11.27.12: {ten: "Thể tích khối chóp có cạnh bên vuông góc với đáy hình vuông khi biết góc nhị diện [B, SC, D]", trang_thai: da-duyet}
12.5.16: {ten: "Tối ưu chi phí đặt hàng và vận chuyển C(x) = a/x^2 + bx/(x + c)", trang_thai: da-duyet}
12.15.9: {ten: "Đường thẳng cắt d và mặt phẳng (P) nhận một điểm làm trung điểm: tìm vectơ chỉ phương", trang_thai: da-duyet}
12.5.17: {ten: "Thang trượt dọc tường: tốc độ đầu trên khi chân thang di chuyển đều (đạo hàm hàm hợp)", trang_thai: da-duyet}
# --- Đề xuất từ đơn vị D15 ((NBV) Đề số 15 MỖI NGÀY 1 ĐỀ) ---
11.20.2: {ten: "Tính chất của hàm số lôgarit cơ số nhỏ hơn 1 (tìm mệnh đề sai)", trang_thai: da-duyet}
11.26.4: {ten: "Khoảng cách từ đỉnh đáy đến mặt bên chứa cạnh vuông góc với đáy (hình chóp đáy hình chữ nhật)", trang_thai: da-duyet}
12.1.17: {ten: "Tính đơn điệu của hàm trùng phương y = x^4 + c (xét khẳng định đúng)", trang_thai: da-duyet}
12.12.11: {ten: "Tích phân với cận đảo ngược (đổi dấu khi đổi cận)", trang_thai: da-duyet}
12.15.10: {ten: "Điểm thuộc đường thẳng cho bởi phương trình chính tắc", trang_thai: da-duyet}
12.6.8: {ten: "Hình chóp có cạnh bên vuông góc với đáy hình vuông: thể tích, khoảng cách, tổng vectơ, góc nhị diện (Đúng/Sai)", trang_thai: da-duyet}
12.16.3: {ten: "Gương phẳng treo tường: tọa độ hóa căn phòng, mặt phẳng, tia phản xạ qua phép đối xứng, góc đường thẳng - mặt phẳng (Đúng/Sai)", trang_thai: da-duyet}
12.19.9: {ten: "Kiểm tra sản phẩm qua hai trạm độc lập: xác suất toàn phần và Bayes (Đúng/Sai)", trang_thai: da-duyet}
11.21.10: {ten: "Lãi kép theo kì hạn: tìm thời gian gửi để đạt số tiền mong muốn (bất phương trình mũ)", trang_thai: da-duyet}
12.19.10: {ten: "Hai tên lửa độc lập bắn mục tiêu: xác suất toàn phần theo số quả trúng", trang_thai: da-duyet}
12.8.14: {ten: "San nền sân trường: bốn điểm đồng phẳng với độ cao các điểm (tọa độ hóa trong không gian)", trang_thai: da-duyet}
12.1.18: {ten: "Hàm số không có cực trị trong bốn hàm cho trước", trang_thai: da-duyet}
12.3.11: {ten: "Hàm f(x) = x - 1/x + 2ln x: đơn điệu, tiệm cận đứng, f(1/x) = -f(x), phương trình f(sin x + 2) + f(1/(cos x + 2)) = 0 (Đúng/Sai)", trang_thai: da-duyet}
12.13.15: {ten: "Tích phân của hàm không dương trên đoạn bằng trừ diện tích hình phẳng", trang_thai: da-duyet}
12.13.16: {ten: "Hai hàm bậc bốn cắt nhau tại ba điểm: hiệu hai hàm, hệ số, công thức hàm, thể tích khối tròn xoay (Đúng/Sai)", trang_thai: da-duyet}
12.13.17: {ten: "Thể tích micro: khối cầu ghép khối nón cụt (đường sinh gồm cung tròn và đoạn thẳng)", trang_thai: da-duyet}
12.8.15: {ten: "Phân tích vectơ c = xa + yb trong không gian Oxyz", trang_thai: da-duyet}
12.8.16: {ten: "Tọa độ đỉnh mái chóp của ngôi nhà khi cạnh bên tạo với đáy góc cho trước", trang_thai: da-duyet}
12.15.11: {ten: "Vectơ pháp tuyến của mặt phẳng vuông góc với đường thẳng cho bởi phương trình chính tắc", trang_thai: da-duyet}
12.17.7: {ten: "Đèn pha lê hình cầu treo trong căn phòng hình hộp: tọa độ tâm, phương trình mặt cầu, khoảng cách (Đúng/Sai)", trang_thai: da-duyet}
11.26.5: {ten: "Khoảng cách giữa hai đường thẳng song song trong hình lập phương", trang_thai: da-duyet}
10.25.1: {ten: "Tổng k.C(2n,k) bằng lũy thừa của 2: đồng nhất thức k.C(n,k) = n.C(n-1,k-1)", trang_thai: da-duyet}
11.27.13: {ten: "Thể tích khối chóp cụt đều khi biết góc nhị diện giữa mặt bên và đáy nhỏ", trang_thai: da-duyet}
12.5.18: {ten: "Tối ưu sản lượng nhà máy theo thời gian làm việc (số tổ, năng suất, phế phẩm)", trang_thai: da-duyet}
# --- Đề xuất từ đơn vị D17 (Đề số 17 MỖI NGÀY 1 ĐỀ), ngày 16/10/2026 ---
10.22.2: {ten: "Khoảng cách ngắn nhất từ tiêu điểm đến điểm trên elip (quỹ đạo Mặt Trăng): a - c", trang_thai: da-duyet}
11.26.6: {ten: "Khoảng cách từ một đỉnh đến mặt bên của lăng trụ đứng có đáy là tam giác vuông cân", trang_thai: da-duyet}
11.27.14: {ten: "Hình chóp tam giác có cạnh bên vuông góc với đáy, đáy vuông tại B có góc 30 độ: khoảng cách, thể tích (Đúng/Sai)", trang_thai: da-duyet}
11.27.15: {ten: "Bể bơi có đáy dốc: dung tích, thể tích nước hiện có và thời gian bơm đến 75% dung tích", trang_thai: da-duyet}
12.1.19: {ten: "Đọc đồ thị đạo hàm y = f'(x) cắt trục tại ba điểm: xét khẳng định sai về đơn điệu và cực trị của f", trang_thai: da-duyet}
12.5.19: {ten: "Trạm cung cấp nước bên bờ sông cho hai xã: tổng khoảng cách nhỏ nhất AM + MB", trang_thai: da-duyet}
12.6.9: {ten: "Khẳng định sai về tổng vectơ trong hình chóp đều (O là giao điểm hai đường chéo đáy)", trang_thai: da-duyet}
12.8.17: {ten: "Diện tích tam giác OAB khi A, B thuộc hai trục tọa độ", trang_thai: da-duyet}
12.8.18: {ten: "Khối pha lê hình bát diện đều: tọa độ đỉnh, khoảng cách, khối lượng, góc nhị diện (Đúng/Sai)", trang_thai: da-duyet}
12.11.9: {ten: "Nguyên hàm của hàm số cho bởi hai công thức (liên tục tại điểm nối), tính F(3)", trang_thai: da-duyet}
12.12.12: {ten: "Vận tốc cho bởi parabol rồi đường thẳng: công thức, tốc độ, quãng đường, độ dời (Đúng/Sai)", trang_thai: da-duyet}
12.13.18: {ten: "Thể tích bình hoa tròn xoay có đường sinh là đồ thị hàm bậc ba (nội suy từ cực đại và các bán kính)", trang_thai: da-duyet}
12.14.10: {ten: "Kiểm tra điểm thuộc mặt phẳng cho bởi phương trình tổng quát", trang_thai: da-duyet}
# --- Đề xuất từ đơn vị D18 ((NBV) Đề số 18), ngày 19/10/2026 ---
10.4.2: {ten: "Quy hoạch tuyến tính: tối thiểu chi phí khẩu phần ăn đảm bảo dinh dưỡng (hệ bất phương trình bậc nhất hai ẩn)", trang_thai: da-duyet}
11.7.3: {ten: "Tiền lãi sau n năm theo lãi kép (quy về cấp số nhân)", trang_thai: da-duyet}
11.27.16: {ten: "Thể tích lăng trụ tam giác khi biết diện tích một mặt bên và khoảng cách từ đỉnh đối diện đến mặt bên đó", trang_thai: da-duyet}
12.3.12: {ten: "Đếm số đường tiệm cận từ bảng biến thiên của hàm số xác định trên (-∞; 0) trừ một điểm (x tiến tới 0 từ bên trái không cho tiệm cận ngang)", trang_thai: da-duyet}
12.4.13: {ten: "Xác định hàm phân thức bậc hai trên bậc nhất từ giao điểm với trục hoành và điểm cực đại, giải phương trình theo độ cao (đường đi khinh khí cầu)", trang_thai: da-duyet}
12.8.19: {ten: "Đường đi ngắn nhất từ một điểm xuống mặt đáy rồi đến điểm khác (điểm đối xứng qua mặt phẳng tọa độ, ba điểm thẳng hàng)", trang_thai: da-duyet}
12.11.10: {ten: "Nguyên hàm của f'(x) khi biết nguyên hàm của f(x)", trang_thai: da-duyet}
12.12.13: {ten: "Đoàn tàu qua cây và qua cầu: vận tốc từ gia tốc, chiều dài tàu, tốc độ, thời gian qua cầu (Đúng/Sai)", trang_thai: da-duyet}
12.12.14: {ten: "Lượng nước trong bể từ tốc độ thay đổi cho bởi hàm số ba khúc (tích phân)", trang_thai: da-duyet}
12.13.19: {ten: "Bức tường chia ba phần bởi đồ thị hàm mũ và hàm lôgarit đối xứng nhau: diện tích từng phần, số hộp sơn, chi phí", trang_thai: da-duyet}
12.14.11: {ten: "Viết phương trình mặt phẳng đi qua một điểm và song song với mặt phẳng cho trước", trang_thai: da-duyet}
12.16.4: {ten: "Côsin góc giữa đường thẳng đi qua hai điểm và mặt phẳng tọa độ Oxy", trang_thai: da-duyet}
12.19.11: {ten: "Xác suất Bayes khi hai người lấy bi nối tiếp, điều kiện tất cả bi chọn ra có đủ cả hai màu", trang_thai: da-duyet}
11.25.5: {ten: "Côsin góc giữa hai mặt phẳng (SCD) và (SAB) trong hình chóp có mặt bên là tam giác đều vuông góc với đáy hình vuông", trang_thai: da-duyet}
11.27.17: {ten: "Chiều cao khối chóp tứ giác đều từ thể tích và cạnh đáy (số liệu thực tế)", trang_thai: da-duyet}
12.2.8: {ten: "Hàm e^{u(x)} với u chứa căn thức: nghiệm của f'(x) = 0, giá trị lớn nhất, nhỏ nhất trên đoạn (Đúng/Sai)", trang_thai: da-duyet}
12.5.20: {ten: "Tối ưu chi phí nhiên liệu của tàu: một phần cố định, một phần tỉ lệ với bình phương vận tốc", trang_thai: da-duyet}
12.6.10: {ten: "Phân tích một vectơ theo ba vectơ cơ sở của hình hộp khi có tâm của mặt", trang_thai: da-duyet}
12.8.20: {ten: "Tìm mệnh đề sai về hai vectơ cho bằng tọa độ (vuông góc, cùng phương, độ dài, tổng)", trang_thai: da-duyet}
12.12.15: {ten: "Hai hàm có cùng đạo hàm: nhận biết khẳng định đúng về nguyên hàm và tích phân", trang_thai: da-duyet}
12.12.16: {ten: "Giá trị trung bình của hàm số trên một đoạn bằng tích phân (hàm lượng giác)", trang_thai: da-duyet}
12.12.17: {ten: "Doanh thu và chi phí của máy công nghiệp theo tốc độ biên: tích phân, tuổi thọ hữu ích, lợi nhuận (Đúng/Sai)", trang_thai: da-duyet}
12.13.20: {ten: "Khối lượng rào chắn bê tông có mặt cắt giới hạn bởi hai đoạn thẳng và một cung cos (diện tích mặt cắt nhân chiều dài)", trang_thai: da-duyet}
12.14.12: {ten: "Mặt phẳng đi qua hai điểm và vuông góc với mặt phẳng cho trước", trang_thai: da-duyet}
12.16.5: {ten: "Mô hình phòng không: UAV bay thẳng đều, góc với mặt đất, khoảng cách ngắn nhất, thời điểm tên lửa đánh chặn (Đúng/Sai)", trang_thai: da-duyet}
12.11.11: {ten: "Nhận biết nguyên hàm của hàm số lũy thừa x^n", trang_thai: de-xuat}
12.11.12: {ten: "Chuyển động thẳng đứng chỉ chịu trọng lực: vận tốc, độ cao bằng nguyên hàm, độ cao lớn nhất", trang_thai: de-xuat}
12.13.21: {ten: "Chọn biểu thức tính diện tích phần tô màu nằm dưới hai đồ thị cắt nhau (giá trị tuyệt đối, tách tại hoành độ giao điểm)", trang_thai: de-xuat}
12.15.12: {ten: "Đường phân giác của góc nhọn tạo bởi hai đường thẳng cắt nhau trong không gian", trang_thai: de-xuat}
12.15.13: {ten: "Đường thẳng trong không gian: vectơ chỉ phương, vuông góc với mặt phẳng, vuông góc với đường khác và song song Oxy, cắt và vuông góc với trục (Đúng/Sai)", trang_thai: de-xuat}
12.17.8: {ten: "Điều kiện của tham số m để phương trình bậc hai ba ẩn là phương trình mặt cầu", trang_thai: de-xuat}
12.17.9: {ten: "Giá trị nhỏ nhất của MA + kMB với M thuộc mặt cầu (điểm phụ theo tỉ số đồng dạng)", trang_thai: de-xuat}
12.17.10: {ten: "Mặt phẳng cắt mặt cầu theo đường tròn ngoại tiếp tam giác ABC có góc ACB cho trước: bán kính, khoảng cách từ tâm, phương trình mặt phẳng", trang_thai: de-xuat}
12.18.6: {ten: "Nhận biết kí hiệu xác suất có điều kiện P(B | A)", trang_thai: de-xuat}
12.18.7: {ten: "Khẳng định luôn đúng về phân tích một biến cố theo B và biến cố đối của B", trang_thai: de-xuat}
