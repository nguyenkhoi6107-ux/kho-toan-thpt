12.6.11: {ten: "Biểu diễn vectơ theo ba vectơ cho trước trong hình chóp có điểm chia cạnh theo tỉ số", trang_thai: da-duyet}
12.6.12: {ten: "Tích vô hướng khi biết độ dài và góc, hoặc góc khi biết tích vô hướng", trang_thai: da-duyet}
12.6.13: {ten: "Độ dài vectơ tổ hợp và góc giữa hai vectơ bằng bình phương vô hướng", trang_thai: da-duyet}
