12.15.16: {ten: "Vectơ chỉ phương của đường thẳng đi qua hình chiếu của một điểm lên hai trục tọa độ", trang_thai: da-duyet}
12.15.17: {ten: "Đường thẳng đi qua một điểm và song song với hai mặt phẳng cắt nhau (tích có hướng hai vectơ pháp tuyến)", trang_thai: da-duyet}
12.15.18: {ten: "Độ dài ngắn nhất của đoạn MN với M, N chạy trên hai đường thẳng chéo nhau (đưa về tổng bình phương)", trang_thai: da-duyet}
12.16.6: {ten: "Góc giữa hai đường thẳng, giữa đường thẳng với trục tọa độ và đường thẳng song song mặt phẳng (Đúng/Sai)", trang_thai: da-duyet}
12.18.8: {ten: "Xác suất có điều kiện của biến cố đối: P(X̄ | Y) = 1 - P(X | Y)", trang_thai: da-duyet}
12.19.12: {ten: "Nhận biết công thức xác suất toàn phần", trang_thai: da-duyet}
