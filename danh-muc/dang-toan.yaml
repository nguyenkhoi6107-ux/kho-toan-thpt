11.30.1: {ten: "Xác suất giao của biến cố đối và biến cố độc lập", trang_thai: da-duyet}
12.1.20: {ten: "Đọc giá trị cực đại, giá trị cực tiểu từ bảng biến thiên và tính tổng", trang_thai: da-duyet}
12.5.21: {ten: "Tối ưu thể tích lăng trụ đặt trong hình chóp có cạnh bên vuông góc đáy (đáy trên là thiết diện song song đáy)", trang_thai: da-duyet}
12.11.14: {ten: "Nguyên hàm của 1/(x + a) thỏa F(x0) cho trước, tính giá trị F tại điểm khác", trang_thai: da-duyet}
12.11.15: {ten: "Lợi nhuận có thuế môi trường khi vượt sản lượng: tìm thuế bằng nguyên hàm, đạo hàm lợi nhuận, lợi nhuận lớn nhất (Đúng/Sai)", trang_thai: da-duyet}
12.15.22: {ten: "Phương trình mặt phẳng đi qua một điểm và vuông góc với đường thẳng cho bởi phương trình chính tắc", trang_thai: da-duyet}
12.16.7: {ten: "Côsin góc giữa mặt phẳng cắt (cho vectơ pháp tuyến) và mặt đất trong mô hình tọa độ hóa", trang_thai: da-duyet}
12.17.15: {ten: "Xác định điểm nằm trong, nằm ngoài mặt cầu bằng khoảng cách đến tâm", trang_thai: da-duyet}
12.19.17: {ten: "Hai loài với một đặc điểm nhận dạng: xác suất toàn phần, Bayes, xác suất phân loại sai (Đúng/Sai)", trang_thai: da-duyet}
# --- Đề xuất từ đơn vị M07 (CĐ2.1–CĐ2.6, Lê Minh Khôi – Nguyễn Anh Khôi), ngày 27/10/2026 ---
12.6.18: {ten: "Điều kiện ba vectơ đồng phẳng (chỉ dùng cho câu cách ly)", trang_thai: de-xuat}
12.6.19: {ten: "Quy tắc ba điểm, quy tắc hiệu, quy tắc hình bình hành, vectơ-không, vectơ bằng nhau (chọn mệnh đề đúng/sai)", trang_thai: de-xuat}
12.6.20: {ten: "Hệ thức vectơ với trọng tâm tứ diện, trọng tâm tam giác và trung điểm", trang_thai: de-xuat}
12.6.21: {ten: "Vectơ lực cùng hướng, tỉ số độ lớn (tích của vectơ với một số) trong bài toán thực tế", trang_thai: de-xuat}
12.6.22: {ten: "Bốn lực cân bằng tại một điểm: độ lớn lực khi biết góc giữa các cặp lực, giá trị lớn nhất của độ lớn lực", trang_thai: de-xuat}
12.7.9: {ten: "Tọa độ điểm đối xứng qua trục tọa độ hoặc qua gốc tọa độ", trang_thai: de-xuat}
12.7.10: {ten: "Gắn hệ trục cho hình lăng trụ, hình hộp, hình chóp, mô hình thực tế: tọa độ đỉnh, tâm, vectơ", trang_thai: de-xuat}
12.8.42: {ten: "Hai vectơ bằng nhau: tìm tham số từ tọa độ", trang_thai: de-xuat}
12.8.44: {ten: "Tìm tham số để ba điểm thẳng hàng", trang_thai: de-xuat}
12.8.45: {ten: "Điểm trên mặt phẳng tọa độ cách đều ba điểm; tâm đường tròn ngoại tiếp tam giác", trang_thai: de-xuat}
12.8.46: {ten: "Chu vi hình bình hành cho bằng tọa độ", trang_thai: de-xuat}
12.8.47: {ten: "Nhận dạng tam giác cho bằng tọa độ (vuông, cân, đều, ba góc nhọn)", trang_thai: de-xuat}
12.8.48: {ten: "Hình chiếu vuông góc của điểm lên đường thẳng đi qua hai điểm (chân đường cao)", trang_thai: de-xuat}
12.8.49: {ten: "Trực tâm tam giác cho bằng tọa độ", trang_thai: de-xuat}
12.8.50: {ten: "Chân và độ dài đường phân giác trong của tam giác cho bằng tọa độ", trang_thai: de-xuat}
12.8.51: {ten: "Điểm làm cho độ dài tổ hợp vectơ |aMA + bMB + ...| nhỏ nhất (tâm tỉ cự, M tùy ý hoặc thuộc trục, mặt phẳng tọa độ)", trang_thai: de-xuat}
12.8.52: {ten: "Cực trị của tổng có hệ số các tích vô hướng MA.MB, MB.MC, MC.MA", trang_thai: de-xuat}
12.8.53: {ten: "Cực trị của tổng có hệ số (có thể âm) các bình phương khoảng cách MA^2, MB^2, ... (tâm tỉ cự)", trang_thai: de-xuat}
12.8.54: {ten: "Hợp lực của các lực cho theo độ lớn và hướng đi qua điểm cho trước", trang_thai: de-xuat}
12.8.55: {ten: "Tháp leo trượt: kích thước, diện tích mặt trượt song song với dây căng", trang_thai: de-xuat}
12.14.15: {ten: "Ứng dụng tích có hướng trong vật lí: moment lực, lực từ, công suất tấm pin", trang_thai: de-xuat}
12.14.16: {ten: "Bốn điểm đồng phẳng, điều kiện bốn điểm tạo thành tứ diện (dùng phương trình mặt phẳng)", trang_thai: de-xuat}
12.14.17: {ten: "Điều kiện đồng phẳng của ba vectơ bằng tích có hướng (chỉ dùng cho câu cách ly)", trang_thai: de-xuat}
12.14.18: {ten: "Diện tích tam giác, đường cao tam giác bằng tích có hướng", trang_thai: de-xuat}
12.14.19: {ten: "Thể tích tứ diện, hình hộp và đường cao bằng tích có hướng và khoảng cách từ điểm đến mặt phẳng", trang_thai: de-xuat}
