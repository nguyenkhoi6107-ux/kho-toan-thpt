<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đấu Trường · Màn hình chiếu — ToánKho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../tro-choi/tro-choi.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23ffd75e'/%3E%3Cpath d='M9 9h14M9 16h14M9 23h8' stroke='%232a2a2a' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  .conn { font-size: 14px; color: #b3261e; } .conn.ok { color: #2f7d32; }
  .btn.big { font-size: 20px; padding: 14px 26px; border-radius: 16px; }
  .dt-lobby { display: grid; grid-template-columns: minmax(280px, 420px) 1fr; gap: 28px; align-items: start; }
  .dt-qr { border: 2px solid var(--line); border-radius: 24px; background: #fff; padding: 18px; text-align: center; }
  .dt-qr svg { width: 100%; height: auto; display: block; }
  .dt-pin small { display: block; color: var(--muted); font-size: 15px; margin-top: 8px; }
  .dt-pin b { font-size: 56px; letter-spacing: 6px; font-variant-numeric: tabular-nums; }
  .dt-link { font-size: 13px; color: var(--muted); word-break: break-all; }
  .dt-players h2 { font-size: 34px; margin-bottom: 6px; }
  .dt-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; max-height: 50vh; overflow: auto; }
  .dt-chips .chip { font-size: 17px; cursor: default; }
  .dt-answered { font-size: 18px; color: var(--muted); margin-right: 8px; }
  .opt.dim { opacity: .45; }
  .dt-cnt { margin-left: auto; padding-left: 12px; font-weight: 600; white-space: nowrap; }
  .dt-sum { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 16px; font-size: 22px; font-weight: 600; }
  .dt-sum .ok { color: #2f7d32; } .dt-sum .part { color: #9a6a00; } .dt-sum .no { color: #b3261e; }
  .dt-table { width: 100%; border-collapse: collapse; font-size: 22px; background: #fff; border: 2px solid var(--line); border-radius: 18px; overflow: hidden; }
  .dt-table th { text-align: left; font-size: 15px; color: var(--muted); font-weight: 500; padding: 10px 16px; border-bottom: 1.5px solid var(--line); }
  .dt-table td { padding: 10px 16px; border-bottom: 1px solid #e5e2d8; }
  .dt-rank { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: #eee; font-weight: 700; }
  .dt-rank.r1 { background: var(--y); } .dt-rank.r2 { background: #d9d9d9; } .dt-rank.r3 { background: #f0c49b; }
  .dt-score { font-weight: 700; font-variant-numeric: tabular-nums; } .dt-last { color: #2f7d32; font-variant-numeric: tabular-nums; }
  .up { color: #2f7d32; font-size: 16px; } .down { color: #b3261e; font-size: 16px; }
  .dt-podium { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: end; max-width: 820px; margin: 0 auto 10px; }
  .dt-pod { border: 2px solid var(--line); border-radius: 20px; text-align: center; padding: 16px 10px; background: #fff; font-size: 22px; }
  .dt-pod.p1 { background: var(--y); padding: 30px 10px; font-size: 28px; } .dt-pod.p2 { background: var(--b); } .dt-pod.p3 { background: var(--p); }
  .dt-medal { font-size: 44px; }
  @media (max-width: 900px) { .dt-lobby { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="host" aria-live="polite"></div>
<script src="../vendor/katex/katex.min.js"></script>
<script src="../vendor/mqtt.min.js"></script>
<script src="../vendor/qrcode.js"></script>
<script src="../hien-thi.js"></script>
<script src="../tro-choi/cham.js"></script>
<script src="ket-noi.js"></script>
<script src="chieu.js"></script>
</body>
</html>
